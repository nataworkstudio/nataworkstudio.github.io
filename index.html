<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Worktask</title>
        <link rel="stylesheet" type="text/css" href="./style.css">
        <link rel="icon" type="image/x-icon" href="./image/nataworkstudio LOGO deep gray.png">
        <script src="./Room.js"></script>
        
    </head>
    <body>
        <div class="mainwindow">
            
            <div id="button-group">
              <div>
                <button roomData="addProduct" class="addElem">Ավելացնել նոր Վճար </button>
                <button roomData="addProduct" class="addDate">Ստեղծել Ամսաթիվ</button>
              </div>
              <div>
                <button roomData="saveResult" class="saveElem">Պահպանել Արդյունքը</button>
                <button roomData="chooseFile" class="inputFile" onclick="document.getElementsByClassName('loadFile')[0].click();this.blur();">Ընտրել Ֆայլ</button>
              </div>
            </div>
            <div>
              <p class="res">0</p>
            </div>
            <div class="centerBox"></div>
            <input class="loadFile" type="file">

            <div class="prompter">
                <p id="id_date" style="color: black;">Ամսաթիվ</p>
                <input type="text" name="0" id="_0_01" autofocus placeholder=" անվանում">
                <input type="number" name="0" id="_0_02" placeholder=" գումար">
                <div>
                  <button id="prompt_ok" class="bok">OK</button>
                  <button id="prompt_cancel" class="bcl">Cancel</button>
                </div>
            </div>
        </div>
        <script src="main.js"></script>
    </body>
</html>
